<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Akses</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, Arial, sans-serif;
  background: #0f0f0f;
  color: #e8eaed;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  padding: 40px 32px;
  max-width: 420px;
  width: 100%;
  text-align: center;
}
.card h2 { font-size: 20px; margin-bottom: 12px; }
.card p { font-size: 14px; color: #9aa0a6; margin-bottom: 24px; }
.slider-wrap {
  position: relative;
  height: 48px;
  background: #2a2a2a;
  border-radius: 24px;
  overflow: hidden;
  user-select: none;
  touch-action: none;
}
.slider-fill {
  position: absolute;
  top: 0; left: 0; height: 100%;
  width: 0;
  background: linear-gradient(90deg, #1a73e8, #4285f4);
}
.slider-text {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #9aa0a6;
  pointer-events: none;
  z-index: 1;
}
.slider-handle {
  position: absolute;
  top: 4px; left: 4px;
  width: 40px; height: 40px;
  background: #fff;
  color: #1a73e8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  cursor: grab;
  z-index: 2;
}
</style>
</head>
<body>
  <div class="card">
    <h2>Verifikasi Diperlukan</h2>
    <p>Untuk melanjutkan geser tombol ke kanan.</p>
    <div class="slider-wrap" id="sliderWrap">
      <div class="slider-fill" id="sliderFill"></div>
      <div class="slider-text" id="sliderText">Geser &raquo;</div>
      <div class="slider-handle" id="sliderHandle">&raquo;</div>
    </div>
  </div>
<script>
(function () {
  var wrap = document.getElementById('sliderWrap');
  var handle = document.getElementById('sliderHandle');
  var fill = document.getElementById('sliderFill');
  var text = document.getElementById('sliderText');
  var dragging = false, startX = 0, currentX = 0;
  function maxX() { return wrap.clientWidth - handle.clientWidth - 8; }
  function start(e) {
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
  }
  function move(e) {
    if (!dragging) return;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var x = clientX - startX;
    if (x < 0) x = 0;
    var max = maxX();
    if (x > max) x = max;
    currentX = x;
    handle.style.left = (x + 4) + 'px';
    fill.style.width = (x + handle.clientWidth + 4) + 'px';
    if (x >= max - 2) {
      dragging = false;
      handle.style.left = (max + 4) + 'px';
      fill.style.width = '100%';
      text.textContent = 'Terverifikasi';
      setTimeout(function() { window.location.href = 'login.html'; }, 400);
    }
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    if (currentX < maxX() - 2) {
      currentX = 0;
      handle.style.left = '4px';
      fill.style.width = '0';
    }
  }
  handle.addEventListener('mousedown', start);
  handle.addEventListener('touchstart', start, { passive: true });
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, { passive: true });
  document.addEventListener('mouseup', end);
  document.addEventListener('touchend', end);
})();
</script>
</body>
</html>
